<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="810" viewBox="0 0 1200 810" role="img" aria-labelledby="title description" xml:lang="zh-TW">
<title id="title">一個治理閉環，多個專業工作區</title>
<desc id="description">使用者目標指導治理 Codex AI。CLI 與 MCP 使用同一引擎。專業工作區可保存檢查點，也可提交明確的穩定階段。核驗接收後形成本地基線，按需採用並保全本地工作。具名恢復核驗實際效果；未能確定的決策可能需要使用者操作。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#47717e"/></marker></defs>
<rect width="1200" height="810" rx="16" fill="#f4f7f7"/>
<g font-family="Segoe UI, Noto Sans CJK SC, Microsoft JhengHei, Microsoft YaHei, sans-serif">
<text x="40" y="46" font-size="29" font-weight="700" fill="#183044">一個治理閉環，多個專業工作區</text>
<text x="40" y="76" font-size="18" fill="#536979">Codex 理解工作；同一本地引擎核驗限定範圍的操作，並記錄實際效果。</text>
<rect x="40" y="108" width="270" height="110" rx="12" fill="#ffffff" stroke="#b8cdd3"/>
<text x="175" y="139" text-anchor="middle" font-size="20" font-weight="650" fill="#183044">使用者目標</text>
<text x="175" y="171" text-anchor="middle" font-size="15.5" fill="#536979">優先順序、決策與授權</text>
<rect x="355" y="108" width="410" height="110" rx="12" fill="#143546" stroke="#143546"/>
<text x="560" y="139" text-anchor="middle" font-size="20" font-weight="650" fill="#ffffff">治理 Codex AI</text>
<text x="560" y="171" text-anchor="middle" font-size="15.5" fill="#d7e6ed">理解任務關係，判斷下一步</text>
<text x="560" y="194" text-anchor="middle" font-size="15.5" fill="#d7e6ed">Skills 提供方法，權限仍須明確</text>
<rect x="810" y="108" width="350" height="110" rx="12" fill="#143546" stroke="#143546"/>
<text x="985" y="139" text-anchor="middle" font-size="20" font-weight="650" fill="#ffffff">CLI / MCP → 共用引擎</text>
<text x="985" y="171" text-anchor="middle" font-size="15.5" fill="#d7e6ed">本地狀態 · 範圍核驗 · 計畫 · 回執</text>
<rect x="40" y="290" width="195" height="140" rx="12" fill="#ffffff" stroke="#b8cdd3"/>
<text x="137.5" y="321" text-anchor="middle" font-size="20" font-weight="650" fill="#183044">專業工作區 1..n</text>
<text x="137.5" y="353" text-anchor="middle" font-size="15.5" fill="#536979">推進已登記任務</text>
<text x="137.5" y="376" text-anchor="middle" font-size="15.5" fill="#536979">保留本地工作</text>
<rect x="270" y="290" width="195" height="140" rx="12" fill="#ffffff" stroke="#b8cdd3"/>
<text x="367.5" y="321" text-anchor="middle" font-size="20" font-weight="650" fill="#183044">穩定交付</text>
<text x="367.5" y="353" text-anchor="middle" font-size="15.5" fill="#536979">精確凍結 Git 變更</text>
<text x="367.5" y="376" text-anchor="middle" font-size="15.5" fill="#536979">明確任務與範圍</text>
<rect x="500" y="290" width="195" height="140" rx="12" fill="#143546" stroke="#143546"/>
<text x="597.5" y="321" text-anchor="middle" font-size="20" font-weight="650" fill="#ffffff">計畫與接收</text>
<text x="597.5" y="353" text-anchor="middle" font-size="15.5" fill="#d7e6ed">核對目前執行條件</text>
<text x="597.5" y="376" text-anchor="middle" font-size="15.5" fill="#d7e6ed">驗證實際發生的效果</text>
<rect x="730" y="290" width="195" height="140" rx="12" fill="#143546" stroke="#143546"/>
<text x="827.5" y="321" text-anchor="middle" font-size="20" font-weight="650" fill="#ffffff">已接收基線</text>
<text x="827.5" y="353" text-anchor="middle" font-size="15.5" fill="#d7e6ed">記錄技術接收回執</text>
<text x="827.5" y="376" text-anchor="middle" font-size="15.5" fill="#d7e6ed">保留階段歷史</text>
<rect x="960" y="290" width="200" height="140" rx="12" fill="#ffffff" stroke="#b8cdd3"/>
<text x="1060" y="321" text-anchor="middle" font-size="20" font-weight="650" fill="#183044">按需採用</text>
<text x="1060" y="353" text-anchor="middle" font-size="15.5" fill="#536979">計畫工作區更新</text>
<text x="1060" y="376" text-anchor="middle" font-size="15.5" fill="#536979">保全 WIP 或回報衝突</text>
<rect x="40" y="520" width="330" height="118" rx="12" fill="#fff7e6" stroke="#d8c69d"/>
<text x="205" y="551" text-anchor="middle" font-size="20" font-weight="650" fill="#183044">檢查點 / 目前狀態</text>
<text x="205" y="583" text-anchor="middle" font-size="15.5" fill="#536979">保存工作與下一步，包含暫停中的工作</text>
<text x="205" y="606" text-anchor="middle" font-size="15.5" fill="#536979">與待接收交付佇列分別管理</text>
<rect x="415" y="520" width="475" height="118" rx="12" fill="#fff7e6" stroke="#d8c69d"/>
<text x="652.5" y="551" text-anchor="middle" font-size="20" font-weight="650" fill="#183044">具名、有界恢復</text>
<text x="652.5" y="583" text-anchor="middle" font-size="15.5" fill="#536979">比對規則，核驗已經發生的效果</text>
<text x="652.5" y="606" text-anchor="middle" font-size="15.5" fill="#536979">只接續已實作恢復路徑中的缺步</text>
<rect x="935" y="520" width="225" height="118" rx="12" fill="#fff7e6" stroke="#d8c69d"/>
<text x="1047.5" y="551" text-anchor="middle" font-size="20" font-weight="650" fill="#183044">必要時由使用者操作</text>
<text x="1047.5" y="583" text-anchor="middle" font-size="15.5" fill="#536979">業務決策或授權</text>
<text x="1047.5" y="606" text-anchor="middle" font-size="15.5" fill="#536979">仍無法確定的事項</text>
<text x="617" y="479" font-size="15.5" fill="#536979">出現缺步時</text>
<g fill="none" stroke="#47717e" stroke-width="2" marker-end="url(#arrow)">
<path d="M310 163H355"/>
<path d="M765 163H810"/>
<path d="M985 218V252H597.5V290"/>
<path d="M235 360H270"/>
<path d="M465 360H500"/>
<path d="M695 360H730"/>
<path d="M925 360H960"/>
<path d="M137.5 430V520"/>
<path d="M597.5 430V520"/>
<path d="M890 579H935"/>
<path d="M1160 360H1180V676H20V360H40"/>
</g>
<text x="600" y="704" text-anchor="middle" font-size="17" fill="#536979">需要時將已接收進度帶回專業工作區，繼續推進任務。</text>
<rect x="40" y="728" width="1120" height="64" rx="9" fill="#e4f2ef"/>
<text x="60" y="753" font-size="17" fill="#285851">檢查點 ≠ 交付 ≠ 業務批准；定時觸發由宿主平台提供。</text>
<text x="60" y="777" font-size="17" fill="#285851">自動恢復僅涵蓋已實作的具名規則，不承諾任意故障自動修復。</text>
</g></svg>
