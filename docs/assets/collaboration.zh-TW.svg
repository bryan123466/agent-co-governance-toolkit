    <text x="600.0" y="421" text-anchor="middle" font-size="16" fill="#58717d" font-weight="400">獨立目錄 · 保存本機工作</text>
    <rect x="795" y="330" width="340" height="125" rx="14" fill="#ffffff" stroke="#cbdcde" />
    <text x="965.0" y="365" text-anchor="middle" font-size="20" fill="#19384b" font-weight="700">專業工作台 n</text>
