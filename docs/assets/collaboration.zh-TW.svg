<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="710" viewBox="0 0 1200 710" role="img" aria-labelledby="title description" xml:lang="zh-TW">
  <title id="title">TaskCarry · 多個工作區，一個持續的專案</title>
  <desc id="description">面向 AI 工具的本機專案記憶與協作。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#6a969b" />
    </marker>
  </defs>
  <rect width="1200" height="710" rx="20" fill="#f3f7f7" />
  <g font-family="Segoe UI, Noto Sans CJK SC, Microsoft JhengHei, Microsoft YaHei, sans-serif">
