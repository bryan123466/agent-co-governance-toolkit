    <text x="235.0" y="211" text-anchor="middle" font-size="16" fill="#58717d" font-weight="400">重要決定與成果驗收</text>
    <rect x="490" y="120" width="645" height="125" rx="14" fill="#19384b" stroke="#cbdcde" />
    <text x="812.5" y="155" text-anchor="middle" font-size="20" fill="#ffffff" font-weight="700">協調對話 · 宿主 AI</text>
    <text x="812.5" y="187" text-anchor="middle" font-size="16" fill="#d9ecec" font-weight="400">理解任務與成果關係</text>
    <text x="812.5" y="211" text-anchor="middle" font-size="16" fill="#d9ecec" font-weight="400">審閱選定計畫，協調共同進度</text>
