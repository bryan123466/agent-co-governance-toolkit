    <text x="42" y="82" text-anchor="start" font-size="18" fill="#58717d" font-weight="400">面向 AI 工具的本機專案記憶與協作。</text>
    <rect x="65" y="120" width="340" height="125" rx="14" fill="#ffffff" stroke="#cbdcde" />
