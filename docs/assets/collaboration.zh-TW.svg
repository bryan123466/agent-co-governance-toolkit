    <path d="M600 455V535" fill="none" stroke="#6a969b" stroke-width="2.2" marker-end="url(#arrow)" />
    <path d="M965 455V500H600" fill="none" stroke="#6a969b" stroke-width="2.2" marker-end="url(#arrow)" />
    <rect x="65" y="535" width="1070" height="105" rx="14" fill="#19384b" stroke="#cbdcde" />
    <text x="600.0" y="570" text-anchor="middle" font-size="20" fill="#ffffff" font-weight="700">TaskCarry · 持久的本機專案記憶</text>
    <text x="600.0" y="602" text-anchor="middle" font-size="16" fill="#d9ecec" font-weight="400">任務與決定  ·  已保存的工作  ·  階段成果與版本  ·  接續資訊與適用經驗</text>
    <path d="M1135 586H1165V180H1135" fill="none" stroke="#6a969b" stroke-width="2.2" marker-end="url(#arrow)" />
    <text x="600" y="682" text-anchor="middle" font-size="17" fill="#58717d" font-weight="400">依需要把共同成果帶回各個工作區，保留各自繼續工作的空間。</text>
