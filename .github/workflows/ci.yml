name: Synthetic checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - name: Use runner temporary directory
        shell: python
        run: |
          import os
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as environment_file:
              environment_file.write('TMPDIR=' + os.environ['RUNNER_TEMP'] + '\n')
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install local distribution
        run: python -m pip install .
      - name: Verify command entrypoint
        run: python -m agct --help
      - name: Run unit and disposable Git integration tests
        run: python -m unittest discover -s tests -v
      - name: Build distribution wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Verify installed wheel and packaged Skills
        run: python scripts/verify_installed_wheel.py --directory dist
